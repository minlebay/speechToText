<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252d47"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- Mic body -->
  <rect x="102.5" y="136.5" width="120" height="190" rx="60" fill="#c0cff7"/>

  <!-- Mic cradle + pole + base, equal gap from the capsule all the way round -->
  <g fill="none" stroke="#c0cff7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 80.5,236.5 L 80.5,266.5 A 82,82 0 0,0 244.5,266.5 L 244.5,236.5" stroke-width="14"/>
    <line x1="162.5" y1="348.5" x2="162.5" y2="405" stroke-width="14"/>
    <line x1="97.5" y1="405" x2="227.5" y2="405" stroke-width="14"/>
  </g>

  <!-- Sound waves (right side, decreasing opacity) -->
  <g fill="none" stroke="#7aa2f7" stroke-linecap="round">
    <path d="M 292.5,176.5 A 135,135 0 0,1 292.5,336.5" stroke-width="14" opacity="0.9"/>
    <path d="M 332.5,141.5 A 175,175 0 0,1 332.5,371.5" stroke-width="13" opacity="0.6"/>
    <path d="M 372.5,106.5 A 215,215 0 0,1 372.5,406.5" stroke-width="12" opacity="0.32"/>
  </g>
</svg>
